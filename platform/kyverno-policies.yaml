# Wave 11 — Kyverno policies (manifests/kyverno). Needs the kyverno CRDs from
# wave 10 to exist first.
#
# Manual sync on purpose: generateExisting creates PDBs in kube-system the moment
# the policy lands, and a wrong selector there is what would make a Talos upgrade
# drain hang. Read the diff, sync, then check `kubectl get pdb -A`.
#
# Under root, this child is Missing until that manual sync, so root parks on it
# after merge: no later commit to platform/ lands until it is synced and Healthy.
# Sync promptly (staging/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: default
  source:
    repoURL: https://github.com/HashVelani/homelab-platform
    targetRevision: main
    path: manifests/kyverno
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # DELIBERATELY no syncPolicy.automated: first sync generates PDBs in kube-system.
  # Sync this from the Argo UI or `argocd app sync` after reading the diff.
  # Enabling automation here is a commit, not a kubectl patch.
  syncPolicy:
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - SkipDryRunOnMissingResource=true
