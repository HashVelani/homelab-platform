# Wave 3 — Istio CRDs + cluster roles. Sidecar control plane, NOT ambient
# (design §4.3: ambient on Cilium has documented sharp edges).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.30.3
    helm:
      values: |
        defaultRevision: default
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod patches its validating webhook from failurePolicy: Ignore (what the
  # chart renders) to Fail, once it can actually serve validation. That is
  # deliberate Istio self-hardening, not drift — but with selfHeal: true Argo
  # reverts it and istiod re-patches it, forever. Each revert briefly downgrades
  # admission validation to fail-open, so the loop is worse than cosmetic.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jqPathExpressions:
        - .webhooks[].failurePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
