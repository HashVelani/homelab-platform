# Wave 5 — monitoring. SSA required (the chart ships CRDs that blow the
# kubectl.kubernetes.io/last-applied-configuration annotation size limit).
# emptyDir persistence until Longhorn lands — metrics do not survive a pod
# restart, and that is the accepted tradeoff for now (design §0).
#
# Grafana admin password: deliberately NOT set here. This repo is public and
# stays credential-free. Use the chart-generated secret for now and move to an
# ESO-minted secret (dc-c8a8/grafana/admin) once the store is Ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.0.0
    helm:
      values: |
        # No storageSpec anywhere => emptyDir.
        prometheus:
          prometheusSpec:
            retention: 7d
        grafana:
          enabled: true
          persistence:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # node-exporter cannot run under Talos' default PSA enforcement. Talos applies
    # `baseline:latest` to any namespace without PSA labels, and the DaemonSet is
    # rejected outright:
    #   violates PodSecurity "baseline:latest": host namespaces
    #   (hostNetwork=true, hostPID=true), hostPath volumes ("proc","sys","root"),
    #   hostPort (container "node-exporter" uses hostPort 9100)
    # Every one of those is inherent to reading host-level metrics, so the pod
    # cannot be made baseline-compliant — the namespace has to permit it. PSA is
    # per-namespace, so this relaxes all of `monitoring`, which is why nothing but
    # the monitoring stack should ever live here.
    # audit/warn stay at baseline so a future violation is still reported.
    # Alternative, if that trade is unwanted: nodeExporter.enabled: false in the
    # values above, losing per-node CPU/memory/disk metrics.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
