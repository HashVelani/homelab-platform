# Wave 5 — monitoring. SSA required (the chart ships CRDs that blow the
# kubectl.kubernetes.io/last-applied-configuration annotation size limit).
# emptyDir persistence until Longhorn lands — metrics do not survive a pod
# restart, and that is the accepted tradeoff for now (design §0).
#
# Grafana admin password: never in this public repo. It comes from AWS Secrets
# Manager (dc-c8a8/grafana/admin, JSON keys username/password) through the
# ExternalSecret in extraManifests below, into the Secret grafana-admin.
#
# Why not the chart-generated secret: with no password set, the grafana subchart
# mints a random one on EVERY render. Each Argo re-render rewrote
# kube-prometheus-stack-grafana with a new password, and checksum/secret rolled
# the pod — ReplicaSets at 18:16, 18:52, 21:48 and 22:40 on 2026-09-12. With
# persistence off, each restart also started Grafana from an empty database.
# Setting admin.existingSecret stops the chart rendering that Secret at all.
#
# The AWS secret must exist BEFORE this syncs: until the ExternalSecret resolves,
# grafana-admin does not exist and the Grafana pod cannot start. Rotating the
# value in AWS updates the Secret within refreshInterval but does not restart
# Grafana — delete the pod to pick it up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.0.0
    helm:
      values: |
        # No storageSpec anywhere => emptyDir.
        prometheus:
          prometheusSpec:
            retention: 7d
        grafana:
          enabled: true
          persistence:
            enabled: false
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
        # Rendered with this chart rather than under manifests/external-secrets
        # (wave 1): the monitoring namespace is created by this app at wave 5, so a
        # wave-1 ExternalSecret here would fail on a fresh rebuild and park root.
        extraManifests:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: grafana-admin
              namespace: monitoring
            spec:
              refreshInterval: 1h
              secretStoreRef:
                kind: ClusterSecretStore
                name: aws
              target:
                name: grafana-admin
                creationPolicy: Owner
              data:
                - secretKey: admin-user
                  remoteRef:
                    key: dc-c8a8/grafana/admin
                    property: username
                - secretKey: admin-password
                  remoteRef:
                    key: dc-c8a8/grafana/admin
                    property: password
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # node-exporter cannot run under Talos' default PSA enforcement. Talos applies
    # `baseline:latest` to any namespace without PSA labels, and the DaemonSet is
    # rejected outright:
    #   violates PodSecurity "baseline:latest": host namespaces
    #   (hostNetwork=true, hostPID=true), hostPath volumes ("proc","sys","root"),
    #   hostPort (container "node-exporter" uses hostPort 9100)
    # Every one of those is inherent to reading host-level metrics, so the pod
    # cannot be made baseline-compliant — the namespace has to permit it. PSA is
    # per-namespace, so this relaxes all of `monitoring`, which is why nothing but
    # the monitoring stack should ever live here.
    # audit/warn stay at baseline so a future violation is still reported.
    # Alternative, if that trade is unwanted: nodeExporter.enabled: false in the
    # values above, losing per-node CPU/memory/disk metrics.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
