# Wave 5 — monitoring. SSA required (the chart ships CRDs that blow the
# kubectl.kubernetes.io/last-applied-configuration annotation size limit).
# emptyDir persistence until Longhorn lands — metrics do not survive a pod
# restart, and that is the accepted tradeoff for now (design §0).
#
# Grafana admin password: deliberately NOT set here. This repo is public and
# stays credential-free. Use the chart-generated secret for now and move to an
# ESO-minted secret (dc-c8a8/grafana/admin) once the store is Ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.0.0
    helm:
      values: |
        # No storageSpec anywhere => emptyDir.
        prometheus:
          prometheusSpec:
            retention: 7d
            # The chart defaults select only monitors and rules labelled
            # release: kube-prometheus-stack, so every ServiceMonitor another app
            # ships (external-secrets, kyverno, cilium, manifests/monitoring) was
            # silently ignored. false = select all, in every namespace (the
            # namespace selectors are already {}).
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
        grafana:
          enabled: true
          persistence:
            enabled: false
          # Dashboards for components whose charts do not ship one. Charts that
          # do, and have it enabled (kyverno, external-secrets), publish ConfigMaps
          # labelled grafana_dashboard=1, which the dashboard sidecar picks up from
          # every namespace. Cilium's arrive the same way once its metrics change
          # (feat/cilium-metrics) lands.
          #
          # The ones below are downloaded from grafana.com by an init container
          # at pod start (cluster egress verified); pinned revisions so a
          # re-render never changes them. No persistence is needed: they are
          # provisioned from here on every start.
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: platform
                  orgId: 1
                  folder: Platform
                  type: file
                  disableDeletion: true
                  editable: false
                  options:
                    path: /var/lib/grafana/dashboards/platform
          dashboards:
            platform:
              argocd:
                gnetId: 14584   # ArgoCD
                revision: 1
                datasource: Prometheus
              cert-manager:
                gnetId: 20842   # Cert-manager-Kubernetes
                revision: 3
                datasource: Prometheus
              istio-control-plane:
                gnetId: 7645    # Istio Control Plane Dashboard
                revision: 329
                datasource: Prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # node-exporter cannot run under Talos' default PSA enforcement. Talos applies
    # `baseline:latest` to any namespace without PSA labels, and the DaemonSet is
    # rejected outright:
    #   violates PodSecurity "baseline:latest": host namespaces
    #   (hostNetwork=true, hostPID=true), hostPath volumes ("proc","sys","root"),
    #   hostPort (container "node-exporter" uses hostPort 9100)
    # Every one of those is inherent to reading host-level metrics, so the pod
    # cannot be made baseline-compliant — the namespace has to permit it. PSA is
    # per-namespace, so this relaxes all of `monitoring`, which is why nothing but
    # the monitoring stack should ever live here.
    # audit/warn stay at baseline so a future violation is still reported.
    # Alternative, if that trade is unwanted: nodeExporter.enabled: false in the
    # values above, losing per-node CPU/memory/disk metrics.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
