# Wave 0 — External Secrets Operator. Closes the OIDC → Secrets Manager loop
# (design §1, §5). No static AWS keys: ESO requests a projected SA token with
# audience sts.amazonaws.com and calls AssumeRoleWithWebIdentity itself.
#
# There is no IRSA webhook on Talos; ESO reads the role ARN off the SA
# annotation eks.amazonaws.com/role-arn (that literal name, off-EKS too).
# Do NOT also set spec.provider.aws.role in the store — that is a second hop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        rbac:
          serviceAccountTokenCreate: false
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::917270840786:role/dc-c8a8-external-secrets
        serviceMonitor:
          enabled: false   # flip in the wave-6 follow-up (design step 14)
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      # Required, though design §4.2 omits ESO from the SSA list. Client-side
      # apply stores the whole object in the last-applied annotation, and the
      # secretstores/clustersecretstores CRDs blow the 262144-byte ceiling:
      #   metadata.annotations: Too long: may not be more than 262144 bytes
      # Verified 2026-09-12: the first sync failed on exactly those two CRDs.
      - ServerSideApply=true
