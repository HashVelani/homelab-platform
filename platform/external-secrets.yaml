# Wave 0 — External Secrets Operator. Closes the OIDC → Secrets Manager loop
# (design §1, §5). No static AWS keys: ESO requests a projected SA token with
# audience sts.amazonaws.com and calls AssumeRoleWithWebIdentity itself.
#
# There is no IRSA webhook on Talos; ESO reads the role ARN off the SA
# annotation eks.amazonaws.com/role-arn (that literal name, off-EKS too).
# Do NOT also set spec.provider.aws.role in the store — that is a second hop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        rbac:
          serviceAccountTokenCreate: false
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::917270840786:role/dc-c8a8-external-secrets
        # Monitoring (design step 14). The controller serves metrics on :8080
        # already; the Service does not exist until metrics.service is on.
        metrics:
          service:
            enabled: true
        # NOT the chart's ServiceMonitor. At wave 0 on a fresh rebuild the
        # monitoring.coreos.com CRDs do not exist yet, so renderMode skipIfMissing
        # omits it — and nothing guarantees this already-Synced app is re-rendered
        # once kube-prometheus-stack installs them at wave 5 (raised in review on
        # PR #27). The ServiceMonitors live in manifests/monitoring/
        # external-secrets.yaml instead, delivered at wave 6.
        serviceMonitor:
          enabled: false
        # The webhook and cert-controller metrics Services are gated separately:
        # the chart renders them for webhook/certController.metrics.service.enabled,
        # or as a side effect of serviceMonitor.enabled — which is off above. Without
        # these two, manifests/monitoring/external-secrets.yaml would select
        # Services that do not exist.
        webhook:
          metrics:
            service:
              enabled: true
        certController:
          metrics:
            service:
              enabled: true
        # ConfigMap labelled grafana_dashboard=1; no CRD involved.
        grafanaDashboard:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      # Required, though design §4.2 omits ESO from the SSA list. Client-side
      # apply stores the whole object in the last-applied annotation, and the
      # secretstores/clustersecretstores CRDs blow the 262144-byte ceiling:
      #   metadata.annotations: Too long: may not be more than 262144 bytes
      # Verified 2026-09-12: the first sync failed on exactly those two CRDs.
      - ServerSideApply=true
