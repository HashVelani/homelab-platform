# Wave 6 — ArgoCD self-manage (design §4 wave table).
#
# Source is this repo's own bootstrap/argocd.yaml — the same pinned, hardened
# manifest Talos seeded from, so adoption is byte-faithful rather than a
# chart-vs-raw-manifest rewrite. directory.include selects ONLY argocd.yaml:
# root-app.yaml lives in the same directory and must not be owned by a child
# (root would then own itself).
#
# Adopting this fixes two live drifts the seed predates: image digests and the
# restricted argocd-server-network-policy.
#
# Design §4.1 closed: the Application health Lua is baked into build-argocd.sh
# and present in the regenerated bootstrap/argocd.yaml, byte-identical to what
# was patched into the live argocd-cm. Syncing this app therefore reinforces the
# health customization instead of reverting it, and rebuilds carry it from
# minute zero.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/HashVelani/homelab-platform
    targetRevision: main
    path: bootstrap
    directory:
      recurse: false
      include: "argocd.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # No syncPolicy.automated — manual sync only until the diff is reviewed (step 4).
  syncPolicy:
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - ServerSideApply=true
