# Wave 8 — LB-IPAM pool + L2 announcement policy (design §7, plan §12).
# Raw CRs live under manifests/ so the root app does not double-own them.
# Requires l2announcements.enabled from the wave-0 cilium app to be live first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-lb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://github.com/HashVelani/homelab-platform
    targetRevision: main
    path: manifests/cilium
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # DELIBERATELY no syncPolicy.automated: depends on l2announcements from the wave-7 cilium adoption.
  # Sync this from the Argo UI or `argocd app sync` after reading the diff.
  # Enabling automation here is a commit, not a kubectl patch.
  syncPolicy:
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
