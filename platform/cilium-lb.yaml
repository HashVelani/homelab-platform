# Wave 8 — LB-IPAM pool + L2 announcement policy (design §7, plan §12).
# Raw CRs live under manifests/ so the root app does not double-own them.
# Requires l2announcements.enabled from the wave-7 cilium app to be live first
# (verified 2026-09-13: cilium-config enable-l2-announcements=true, agents on enp1s0).
#
# Promoted from staging/ as the first step toward ingress (Istio gateway at wave 9,
# then external-dns). Under root, this child is Missing until its manual sync, so
# root parks on it after merge: no later commit to platform/ lands until it is
# synced and Healthy. Sync promptly (staging/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-lb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://github.com/HashVelani/homelab-platform
    targetRevision: main
    path: manifests/cilium
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # DELIBERATELY no syncPolicy.automated: depends on l2announcements from the wave-7 cilium adoption.
  # Sync this from the Argo UI or `argocd app sync` after reading the diff.
  # Enabling automation here is a commit, not a kubectl patch.
  syncPolicy:
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
