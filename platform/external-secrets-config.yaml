# Wave 1 (after the operator) — ESO custom resources from git.
# Separate Application so the ClusterSecretStore is owned here, not by the Helm
# release, and not by root (manifests/ sits outside the root app's path).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/HashVelani/homelab-platform
    targetRevision: main
    path: manifests/external-secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
