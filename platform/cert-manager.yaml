# Wave 2 — cert-manager. crds.enabled: true is NOT the chart default.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.0
    helm:
      values: |
        crds:
          enabled: true
        prometheus:
          # NOT a top-level serviceMonitor key — the cert-manager chart nests it
          # under prometheus and spells it lowercase, and its values.schema.json
          # rejects unknown properties outright, so `serviceMonitor:` made the app
          # unrenderable: "additional properties 'serviceMonitor' not allowed",
          # surfacing as ComparisonError / sync Unknown rather than a sync failure.
          # false is also the chart default; stated explicitly because design
          # step 14 flips it on once kube-prometheus-stack lands.
          enabled: true
          servicemonitor:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      # Same reason as ESO: crds.enabled ships CRDs large enough to blow the
      # 262144-byte last-applied-configuration ceiling under client-side apply.
      # ESO hit exactly that on 2026-09-12; do not wait to rediscover it here
      # now that this app syncs unattended.
      - ServerSideApply=true
