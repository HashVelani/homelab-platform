# Wave 7 — adopt the inline Talos Cilium install and add the three deltas.
#
# Chart 1.18.0 matches the live image (quay.io/cilium/cilium:v1.18.0) so the
# adoption diff is the new flags, not a wipe. Values below are the live set from
# the private repo's bootstrap/cilium-values.yaml PLUS design §7 deltas.
#
# DANGER (design §7): never enable automated sync + prune on an adopted CNI
# before `argocd app diff cilium` has been read. A bad diff takes node
# networking down. Manual sync, review, then Healthy, then consider automation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.18.0
    helm:
      values: |
        # --- live values, verbatim from bootstrap/cilium-values.yaml ---
        ipam:
          mode: kubernetes
        kubeProxyReplacement: true
        k8sServiceHost: localhost
        k8sServicePort: 7445
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
        # --- design §7 deltas: required before Istio / LB-IPAM work ---
        socketLB:
          hostNamespaceOnly: true   # socket LB breaks Istio redirection under KPR without this
        cni:
          exclusive: false          # else Cilium deletes istio-cni's chained config
        l2announcements:
          enabled: true             # else LB-IPAM hands out IPs nothing ARPs for
        bpf:
          masquerade: false         # keep off: Talos forwardKubeDNSToHost
        # --- adoption safety: keep TLS material out of the Helm render ---
        # With the default (helm) method the chart mints the Cilium CA and the
        # Hubble server certs itself, via genCA/genSignedCert. Those are
        # NON-DETERMINISTIC: two renders of the identical chart and values
        # produce different key material (verified 2026-09-12 —
        # render#1 ca.crt sha256 235380b968d2, render#2 5fdbb9d153ac).
        #
        # Adopting the live install under that default would not merely rotate
        # the CA once. Every manifest regeneration yields new material, so the
        # app is permanently OutOfSync and selfHeal rewrites the cluster PKI on
        # each pass. bootstrap-plan.md §"Cilium 1.18.0 ... produces a cilium-ca
        # Secret carrying the CA private key" flagged the secrets; it did not
        # catch that they are regenerated.
        #
        # cronJob renders NO Secrets at all — cert material is generated and
        # rotated in-cluster by hubble-generate-certs (Job + CronJob) and is
        # never Helm-owned. The existing cilium-ca and hubble-server-certs
        # Secrets are untouched: Argo never adopted them, so prune ignores them.
        #
        # certmanager is the other option and cert-manager is now Healthy at
        # wave 2, but it needs an issuerRef and does not render bare, so it is a
        # larger change than adoption should carry.
        hubble:
          tls:
            auto:
              method: cronJob
        # --- rollout: one node at a time ---
        # Chart default is maxUnavailable: 2 (maxSurge 0) for both DaemonSets. On
        # a 3-node cluster that restarts 2 of 3 agents at once — observed on
        # 2026-09-12, when the Argo UI Restart action that activated the §7
        # deltas took cp-01 and cp-02 down together. A bad flag should cost one
        # node, not two.
        #
        # A PodDisruptionBudget cannot do this job: the DaemonSet controller
        # deletes pods directly rather than through the Eviction API, and drains
        # skip DaemonSet pods anyway. Only updateStrategy governs a rollout.
        #
        # Syncing this changes spec.updateStrategy only, not the pod template, so
        # it restarts nothing.
        updateStrategy:
          rollingUpdate:
            maxUnavailable: 1
        envoy:
          updateStrategy:
            rollingUpdate:
              maxUnavailable: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # DELIBERATELY no syncPolicy.automated: live CNI adoption; a bad diff drops node networking and kubectl with it.
  # Sync this from the Argo UI or `argocd app sync` after reading the diff.
  # Enabling automation here is a commit, not a kubectl patch.
  syncPolicy:
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - ServerSideApply=true
