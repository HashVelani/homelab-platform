# Argo CD metrics. bootstrap/argocd.yaml (the upstream install manifest) ships a
# metrics Service per component but no ServiceMonitors. Selectors match the
# upstream app.kubernetes.io/name labels on those Services; every port is named
# "metrics".
#
# NetworkPolicy: argocd-server-network-policy admits 8083 (server metrics) from
# the argocd namespace only, so the argocd-server target reads down until that
# policy also admits monitoring (build-argocd.sh). The other components' metrics
# ports already allow every namespace.
#
# No ServiceMonitor for argocd-dex-server. With no dex.config / oidc.config in
# argocd-cm, Dex logs "dex is not configured" and never starts its server, so
# nothing listens on 5558 — the target was permanently down ("connection
# refused", observed 2026-09-13 after #27). Add it back when bundled Dex is configured (`dex.config`).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-application-controller
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-server
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server-metrics
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-applicationset-controller
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-applicationset-controller
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-notifications-controller
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-notifications-controller-metrics
  endpoints:
    - port: metrics
