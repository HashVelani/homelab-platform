# External Secrets metrics (:8080, port "metrics"). The metrics Services come
# from the chart (metrics.service, webhook.metrics.service and
# certController.metrics.service in platform/external-secrets.yaml); the
# ServiceMonitors are here, not the chart's toggle, because ESO syncs at wave 0
# — before the monitoring.coreos.com CRDs exist — and would not be guaranteed a
# re-render afterwards.
#
# Selectors use app.kubernetes.io/name + instance only. The chart's own
# ServiceMonitors also match app.kubernetes.io/metrics, but that label is only
# rendered onto the Services when the chart's serviceMonitor toggle is on —
# which it is not — so copying it would select nothing (verified against a
# helm template of external-secrets 2.8.0).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets-metrics
  namespace: external-secrets
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: external-secrets
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets-webhook-metrics
  namespace: external-secrets
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
      app.kubernetes.io/instance: external-secrets
  endpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets-cert-controller-metrics
  namespace: external-secrets
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-cert-controller
      app.kubernetes.io/instance: external-secrets
  endpoints:
    - port: metrics
