# LB-IPAM pool — plan §12 carve. The RB5009 DHCP pool is .50-.199, so
# .200-.250 is outside it and must stay non-leasable.
# CRD serves v2 and v2alpha1 on Cilium 1.18; v2 is the storage version.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-pool
spec:
  blocks:
    - start: 192.168.88.200
      stop: 192.168.88.250
