apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-serviceaccount-token
  namespace: external-secrets
rules:
  # resourceNames DOES constrain this rule, despite the usual "resourceNames
  # cannot restrict create" guidance. That guidance is about ordinary creates,
  # where the object name is in the request body and unknown at authorization
  # time. TokenRequest is a subresource: the parent name is in the path,
  #   POST /api/v1/namespaces/{ns}/serviceaccounts/{name}/token
  # so the authorizer sees a resource name and matches it. Without this list the
  # Role mints tokens for EVERY ServiceAccount in the namespace.
  # Verify after sync:
  #   kubectl auth can-i create serviceaccounts/token --subresource=token \
  #     --as=system:serviceaccount:external-secrets:external-secrets \
  #     -n external-secrets --name=default        # must print "no"
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - external-secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-serviceaccount-token
  namespace: external-secrets
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-serviceaccount-token
