# ClusterSecretStore — the acceptance test for the whole §1 trust path.
# No static keys: JWT auth via SA token projection, audience sts.amazonaws.com
# (must match the apiServer api-audiences, which it already does).
# Deliberately no spec.provider.aws.role — the role ARN comes from the SA
# annotation set in platform/external-secrets.yaml. Setting both = second hop.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws
  annotations:
    # ESO CRDs land in the same wave; tolerate them not existing at dry-run time.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            # NO audiences list here, despite platform-design.md §5 showing one.
            # ESO always requests sts.amazonaws.com itself; naming it again mints a
            # token carrying two audience entries, and STS rejects that outright:
            #   InvalidIdentityToken: Token audience contains more than one
            #   audience while authorized party is not present
            # (no azp claim is produced, so there is nothing to disambiguate it).
            # Verified 2026-09-12: with this list present the store reported
            # InvalidProviderConfig; removing it flipped it to Ready/Valid.
