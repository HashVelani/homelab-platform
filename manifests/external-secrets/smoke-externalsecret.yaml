# THROWAWAY — design step 8, the end-to-end proof that the OIDC path moves real
# data: ESO reads dc-c8a8/smoke from Secrets Manager and writes it into a
# Kubernetes Secret. Delete this file and the AWS secret once it has synced:
#   aws secretsmanager delete-secret --secret-id dc-c8a8/smoke \
#     --force-delete-without-recovery
#
# Contains a reference only. The value lives in AWS and, once synced, in the
# cluster — never in this public repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smoke
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws
    kind: ClusterSecretStore
  target:
    name: smoke
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        key: dc-c8a8/smoke
