# Lets Kyverno's background controller write the PDBs default-pdb generates.
#
# The chart grants its controllers get/list/watch on most kinds but never
# create/update/delete — generate rights are opt-in per kind. Without this the
# policy reports Ready (RBACPermissionsGranted=True only checks what the chart
# ships) while every generation fails. Observed on the first sync, 2026-09-12:
#
#   failed to generate resources: permission denied: poddisruptionbudgets.policy
#   is forbidden: User "system:serviceaccount:kyverno:kyverno-background-controller"
#   cannot create resource "poddisruptionbudgets" in API group "policy" in the
#   namespace "kube-system"
#
# The label aggregates these rules into the chart's kyverno:background-controller
# ClusterRole (platform/kyverno.yaml ignores diffs on its /rules for exactly this
# reason). Only the background controller: generation, generateExisting and
# synchronize all run there; the admission controller only needs the read
# access it already has for resource.List in the policy.
#
# update/patch/delete: synchronize keeps downstream PDBs in step with their
# Deployment and removes them when a trigger stops matching.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:poddisruptionbudgets
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "update", "patch", "delete"]
