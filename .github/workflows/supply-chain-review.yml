name: Supply Chain Review Reminder

on:
  schedule:
    # Mondays at 14:00 UTC (fixed UTC schedule; local time varies with DST)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-review-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create weekly review issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `Weekly supply-chain review (${today})`;
            const body = [
              "## Checklist",
              "- [ ] Validate ArgoCD image tag+digest in `bootstrap/argocd.yaml`",
              "- [ ] Validate Dex image tag+digest in `bootstrap/argocd.yaml`",
              "- [ ] Validate Redis image tag+digest in `bootstrap/argocd.yaml`",
              "- [ ] Review CVEs for ArgoCD, Dex, and Redis images",
              "- [ ] If updates are needed, regenerate `bootstrap/argocd.yaml` and open a PR",
            ].join("\n");

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            if (existing.some((issue) => issue.title === title)) {
              core.info(`Issue already exists: ${title}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
